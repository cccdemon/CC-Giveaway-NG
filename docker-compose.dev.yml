services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ccg
      POSTGRES_PASSWORD: ccg
      POSTGRES_DB: ccg
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccg"]
      interval: 5s
      retries: 10
    stop_grace_period: 30s
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    stop_grace_period: 30s
volumes:
  pgdata:
