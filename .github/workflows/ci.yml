name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # E2E (NEW_DESIGN.md 12.2): Playwright gegen den Stack aus packages/web/e2e/stack.ts (PostgreSQL per Testcontainers, Twitch-Stub).
      - run: npx playwright install --with-deps chromium
        working-directory: packages/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/test-results
          retention-days: 7
      # Betrieb (NEW_DESIGN.md 12.3): Images bauen und Compose-Datei prüfen, kein Deploy aus CI.
      - run: docker build -f Dockerfile -t ccg-server .
      - run: docker build -f packages/web/Dockerfile -t ccg-web .
      - run: mkdir -p secrets && echo test > secrets/token.key && PG_PASSWORD=ci docker compose --env-file .env.production.example config -q
      - run: docker build -t ccg-caddy caddy
      - run: for f in Caddyfile Caddyfile.local; do docker run --rm -v "$PWD/caddy/$f:/etc/caddy/Caddyfile:ro" -e DOMAIN=example.org -e CF_API_TOKEN=abcdefghijklmnopqrstuvwxyz0123456789ABCD ccg-caddy caddy validate --config /etc/caddy/Caddyfile; done
